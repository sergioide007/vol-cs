# Registro de identificadores legales. ÚNICA fuente de ISBN, Depósito Legal, autores y edición.
# tools/render_legal.py lo usa para: (1) la hoja de créditos de cada volumen/idioma,
# (2) los metadatos de EPUB/PDF (ISBN, autores, derechos) y (3) la página de volúmenes.
# Deja PENDIENTE hasta tener el dato; con --strict (releases) el build falla si queda alguno,
# si un ISBN no es válido (dígito de control) o si autores y cubierta no coinciden.
#
# REQUISITOS BNP (Ley 31253 y gob.pe «Solicitar la constancia de depósito legal»), 2026:
#  · Depósito Legal: se pide ANTES de publicar en SIRNADEL (gratuito, inmediato) → nº de registro.
#    Luego, para libros electrónicos, se entrega UNA versión final por SIRNADEL en 90 días hábiles
#    desde el último día hábil del mes y año de la edición. Un nº por obra/edición (cada idioma
#    y cada volumen es una obra distinta).
#  · La hoja de créditos debe llevar: título, nº de edición, mes y año de edición, autor(es),
#    razón social y domicilio legal del editor, y el nº de Depósito Legal. En e-books NO es
#    obligatorio consignar impresor ni tiraje; en la edición IMPRESA sí (ver `printer`).
#  · ISBN: los 8 volúmenes de la serie NO llevan ISBN (decisión: publicación en acceso abierto con
#    licencia CC BY-NC-SA 4.0; solo Depósito Legal). Por eso isbn_* = NO. Si algún día se pide ISBN
#    (Agencia Peruana del ISBN, BNP), uno por formato e idioma, basta con rellenar isbn_* y la
#    hoja de créditos vuelve a mostrar la tabla de ISBN. El libro 1 (aparte) sí tiene ISBN propio.
#  · El DNI NO figura entre los datos obligatorios: déjalo vacío salvo que quieras imprimirlo.
publisher: "Sergio Perez Ruiz"
publisher_kind: "autor-editor, persona natural"
publisher_id: ""            # opcional (DNI/RUC). Vacío = no se imprime.
publisher_address: "Jr. Los Pinos 611, Asent. H. Jesús María, Mz. F, Lt. 10, distrito de Manantay, provincia de Coronel Portillo, Ucayali – Perú. Código Postal: 25002"   # igual que en SIRNADEL (domicilio de RENIEC)
publisher_contact: "sergio@specsolid.com"
place: "Lima, Perú"
# Debe coincidir con la leyenda de cubierta (tools/covers/cover-design.json). Separa con «;».
authors: "Sergio Perez Ruiz"
# Dominio de la web de publicación por volúmenes (la lectura en línea sale de web/site.config.json).
info_site: "info-codigo-sintetico.specsolid.com"
# Apoyo voluntario (acceso abierto): se imprime en la hoja de créditos y en la web.
donate_kofi: "https://ko-fi.com/sergioperezruiz"
donate_patreon: "https://www.patreon.com/SergioPerezRuiz"
# Datos del impresor: solo se imprimen si algún volumen tiene isbn_print distinto de NO.
printer: "PENDIENTE (razón social y domicilio legal del impresor)"
license_name: "CC BY-NC-SA 4.0"
license_url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"
# `site` sale de web/site.config.json (url): no se repite aquí.
#
# Por volumen e idioma:
#   edition       nº de edición (1 = primera)
#   edition_date  AAAA-MM, mes y año de la edición (exigido por la BNP)
#   isbn_*        978-612-… o NO si ese formato no existe
#   deposito_legal  AAAA-NNNNN (ej. 2026-09631)
#   kdp / google_play / lulu   enlace de compra; vacío = «próximamente»
volumes:
  vol1:
    es: { edition: 1, edition_date: 2026-10, isbn_epub: NO, isbn_pdf: NO, isbn_print: NO, deposito_legal: 2026-13608, kdp: "", google_play: "", lulu: "" }
